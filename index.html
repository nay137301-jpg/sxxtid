<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>페어틀 제작기</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, "Noto Sans KR", sans-serif;
    background: #eeeeee;
    color: #111;
}

/* =========================
   전체 레이아웃
========================= */

.app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

.toolbar {
    width: 100%;
    background: #222;
    color: white;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
}

.toolbar h1 {
    margin: 0;
    font-size: 20px;
    margin-right: auto;
}

.toolbar-group {
    display: flex;
    align-items: center;
    gap: 7px;
}

.toolbar label {
    font-size: 13px;
}

.toolbar input[type="color"] {
    width: 38px;
    height: 32px;
    border: none;
    padding: 0;
    cursor: pointer;
}

.toolbar select,
.toolbar button {
    height: 34px;
    border: none;
    border-radius: 7px;
    padding: 0 12px;
    font-size: 13px;
    cursor: pointer;
}

.toolbar button {
    background: #7d1bd1;
    color: white;
    font-weight: bold;
}

.toolbar button:hover {
    background: #972ce8;
}

/* =========================
   페어틀 영역
========================= */

.workspace {
    flex: 1;
    padding: 35px;
    display: flex;
    justify-content: center;
    overflow: auto;
}

.pair-template {
    position: relative;

    width: 1500px;
    min-width: 1100px;

    min-height: 900px;

    padding: 40px;

    background: #ffffff;

    border-radius: 12px;

    display: grid;

    grid-template-columns: 920px 1fr;

    column-gap: 70px;

    overflow: hidden;
}

/* =========================
   왼쪽 영역
========================= */

.left-area {
    position: relative;

    display: flex;
    flex-direction: column;

    padding-top: 5px;
}

/* 사람 / 캐릭터 이미지 */

.person-block {
    position: relative;
    width: 100%;
}

.person-image {
    position: absolute;

    width: 210px;
    height: 210px;

    object-fit: cover;

    background: #a663df;

    border-radius: 50%;

    top: -10px;
    left: 0;

    cursor: pointer;
}

.person-label {
    position: absolute;

    top: 78px;
    left: 0;

    width: 210px;

    text-align: center;

    font-size: 42px;
    font-weight: bold;

    pointer-events: none;

    color: #111;
}

/* A 텍스트 */

.name1-box {
    position: absolute;

    top: 215px;
    left: 18px;

    width: 250px;
}

.name2-box {
    position: absolute;

    top: 510px;
    left: 680px;

    width: 250px;
}

/* 이미지 영역 */

.main-image {
    position: absolute;

    width: 600px;
    height: 180px;

    object-fit: cover;

    border-radius: 35px;

    background: #81b9f0;

    cursor: pointer;
}

.main-image.a {
    left: 220px;
    top: 15px;
}

.main-image.b {
    left: 0;
    top: 330px;
}

/* B 캐릭터 */

.person-image.b-person {
    top: 235px;
    left: 680px;
}

.person-label.b-label {
    top: 313px;
    left: 680px;
}

/* =========================
   편집 가능한 텍스트
========================= */

.edit-text {
    min-height: 60px;

    border-radius: 25px;

    background: #81b9f0;

    padding: 22px 30px;

    font-size: 28px;

    font-weight: 500;

    outline: none;

    cursor: text;

    overflow-wrap: anywhere;
}

.edit-text:focus {
    box-shadow: 0 0 0 3px rgba(125, 27, 209, .35);
}

/* 이름 */

.name-text {
    background: transparent;
    padding: 0;

    min-height: auto;

    font-size: 30px;
    font-weight: bold;

    border-radius: 0;
}

/* =========================
   A2 / B2
========================= */

.exchange-area {
    position: absolute;

    left: 0;
    right: 0;

    top: 610px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 10px;
}

.square-box {
    position: relative;

    width: 180px;
    height: 180px;

    border-radius: 28px;

    background: #8b16d4;

    overflow: hidden;
}

.square-box img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    cursor: pointer;
}

.square-letter {
    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 34px;
    font-weight: bold;

    pointer-events: none;

    color: #111;
}

.exchange-center {
    flex: 1;

    margin: 0 25px;

    display: flex;
    flex-direction: column;

    align-items: center;

    gap: 14px;
}

.exchange-row {
    width: 100%;

    display: flex;

    align-items: center;

    gap: 10px;
}

.arrow {
    flex: 1;

    height: 3px;

    background: #111;

    position: relative;
}

.arrow.right::after {
    content: "";

    position: absolute;

    right: -2px;
    top: 50%;

    transform: translateY(-50%);

    border-left: 18px solid #111;
    border-top: 8px solid transparent;
    border-bottom: 8px solid transparent;
}

.arrow.left::after {
    content: "";

    position: absolute;

    left: -2px;
    top: 50%;

    transform: translateY(-50%);

    border-right: 18px solid #111;
    border-top: 8px solid transparent;
    border-bottom: 8px solid transparent;
}

.exchange-text {
    flex: 1;

    min-height: 42px;

    background: transparent;

    border-radius: 8px;

    padding: 8px 12px;

    font-size: 22px;

    font-weight: bold;

    outline: none;

    text-align: center;
}

.exchange-text:focus {
    background: rgba(129, 185, 240, .25);
}

/* =========================
   오른쪽 타임라인
========================= */

.timeline-area {
    position: relative;

    padding-top: 20px;

    padding-left: 60px;

    display: flex;
    flex-direction: column;
}

.timeline-title {
    font-size: 56px;

    font-weight: 800;

    margin: 0 0 40px 0;
}

/* 타임라인 본체 */

.timeline-list {
    position: relative;

    display: flex;

    flex-direction: column;

    gap: 25px;

    padding: 0 0 0 70px;
}

/* 검은 선 */

.timeline-line {
    position: absolute;

    left: 10px;

    top: 0;

    bottom: 0;

    width: 6px;

    background: #111;

    border-radius: 10px;
}

/* 타임라인 박스 */

.timeline-item {
    position: relative;

    min-height: 125px;

    display: flex;
    align-items: center;
}

.timeline-dot {
    position: absolute;

    left: -65px;

    width: 20px;
    height: 20px;

    background: #111;

    border-radius: 50%;
}

.timeline-text {
    width: 100%;

    min-height: 125px;

    border-radius: 32px;

    background: #81b9f0;

    padding: 28px 32px;

    font-size: 28px;

    line-height: 1.4;

    outline: none;

    resize: none;

    font-family: inherit;

    border: none;
}

.timeline-text:focus {
    box-shadow: 0 0 0 3px rgba(125, 27, 209, .35);
}

/* =========================
   선택된 요소 컨트롤
========================= */

.control-panel {
    position: fixed;

    right: 20px;
    bottom: 20px;

    width: 280px;

    background: rgba(25,25,25,.96);

    color: white;

    padding: 18px;

    border-radius: 14px;

    box-shadow: 0 10px 40px rgba(0,0,0,.3);

    z-index: 1000;
}

.control-panel h3 {
    margin: 0 0 15px;

    font-size: 16px;
}

.control-row {
    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 12px;

    gap: 10px;
}

.control-row label {
    font-size: 13px;
}

.control-row input[type="range"] {
    flex: 1;
}

.control-row input[type="color"] {
    width: 50px;
    height: 32px;
    border: none;
}

/* 숨겨진 파일 입력 */

.file-input {
    display: none;
}

/* 모바일 */

@media (max-width: 1100px) {
    .workspace {
        justify-content: flex-start;
    }

    .pair-template {
        transform-origin: top left;
    }

    .control-panel {
        width: 250px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- =========================
         상단 편집 툴바
    ========================== -->

    <div class="toolbar">

        <h1>PAIR TEMPLATE EDITOR</h1>

        <div class="toolbar-group">
            <label>배경</label>

            <select id="bgType">
                <option value="solid">단색</option>
                <option value="linear">선형 그라데이션</option>
                <option value="radial">원형 그라데이션</option>
            </select>

            <input type="color" id="bgColor1" value="#ffffff">
            <input type="color" id="bgColor2" value="#d9e9ff">
        </div>

        <button id="addTimeline">
            + 타임라인 추가
        </button>

        <button id="removeTimeline">
            - 타임라인 삭제
        </button>

    </div>


    <!-- =========================
         작업 영역
    ========================== -->

    <div class="workspace">

        <div class="pair-template" id="template">

            <!-- =========================
                 왼쪽
            ========================== -->

            <section class="left-area">

                <!-- A 이미지 -->

                <div class="person-block">

                    <img
                        id="imgA"
                        class="person-image"
                        src="https://via.placeholder.com/500x500/a663df/ffffff?text=A"
                        alt="A"
                    >

                    <div class="person-label">A</div>

                    <input
                        type="file"
                        class="file-input"
                        id="fileA"
                        accept="image/*"
                    >

                </div>


                <!-- A 이름 -->

                <div
                    class="edit-text name-text name1-box"
                    contenteditable="true"
                >
                    Name 1
                </div>


                <!-- A 설명 이미지/텍스트 -->

                <img
                    id="imgMainA"
                    class="main-image a"
                    src="https://via.placeholder.com/900x300/81b9f0/ffffff?text=IMAGE"
                    alt="A Main"
                >

                <input
                    type="file"
                    class="file-input"
                    id="fileMainA"
                    accept="image/*"
                >


                <!-- B 메인 이미지 -->

                <img
                    id="imgMainB"
                    class="main-image b"
                    src="https://via.placeholder.com/900x300/81b9f0/ffffff?text=IMAGE"
                    alt="B Main"
                >

                <input
                    type="file"
                    class="file-input"
                    id="fileMainB"
                    accept="image/*"
                >


                <!-- B 캐릭터 -->

                <img
                    id="imgB"
                    class="person-image b-person"
                    src="https://via.placeholder.com/500x500/a663df/ffffff?text=B"
                    alt="B"
                >

                <div class="person-label b-label">B</div>

                <input
                    type="file"
                    class="file-input"
                    id="fileB"
                    accept="image/*"
                >


                <!-- B 이름 -->

                <div
                    class="edit-text name-text name2-box"
                    contenteditable="true"
                >
                    Name 2
                </div>


                <!-- =========================
                     A2 / B2
                ========================== -->

                <div class="exchange-area">

                    <!-- A2 -->

                    <div class="square-box">

                        <img
                            id="imgA2"
                            src="https://via.placeholder.com/500x500/8b16d4/ffffff?text=A2"
                            alt="A2"
                        >

                        <div class="square-letter">A2</div>

                        <input
                            type="file"
                            class="file-input"
                            id="fileA2"
                            accept="image/*"
                        >

                    </div>


                    <!-- 교환 문구 -->

                    <div class="exchange-center">

                        <div class="exchange-row">

                            <div class="arrow right"></div>

                        </div>

                        <div
                            class="exchange-text"
                            contenteditable="true"
                        >
                            A2에서 B2
                        </div>


                        <div class="exchange-row">

                            <div class="arrow left"></div>

                        </div>

                        <div
                            class="exchange-text"
                            contenteditable="true"
                        >
                            B2에서 A2
                        </div>

                    </div>


                    <!-- B2 -->

                    <div class="square-box">

                        <img
                            id="imgB2"
                            src="https://via.placeholder.com/500x500/8b16d4/ffffff?text=B2"
                            alt="B2"
                        >

                        <div class="square-letter">B2</div>

                        <input
                            type="file"
                            class="file-input"
                            id="fileB2"
                            accept="image/*"
                        >

                    </div>

                </div>

            </section>


            <!-- =========================
                 오른쪽 타임라인
            ========================== -->

            <section class="timeline-area">

                <h2 class="timeline-title">
                    Time line
                </h2>

                <div
                    class="timeline-list"
                    id="timelineList"
                >

                    <div class="timeline-line"></div>

                    <div class="timeline-item">

                        <div class="timeline-dot"></div>

                        <div
                            class="timeline-text"
                            contenteditable="true"
                        >
                            Timeline 1
                        </div>

                    </div>

                </div>

            </section>

        </div>

    </div>

</div>


<!-- =========================
     선택된 텍스트 컨트롤
========================= -->

<div class="control-panel">

    <h3>선택한 텍스트 설정</h3>

    <div class="control-row">

        <label>글자 크기</label>

        <input
            type="range"
            id="fontSize"
            min="10"
            max="100"
            value="28"
        >

        <span id="fontSizeValue">28</span>

    </div>


    <div class="control-row">

        <label>박스 색상</label>

        <input
            type="color"
            id="boxColor"
            value="#81b9f0"
        >

    </div>

</div>


<script>

/* =====================================================
   이미지 업로드
===================================================== */

function setupImageUpload(imageId, fileId) {

    const image = document.getElementById(imageId);
    const file = document.getElementById(fileId);

    image.addEventListener("click", () => {
        file.click();
    });

    file.addEventListener("change", (event) => {

        const selected = event.target.files[0];

        if (!selected) return;

        const reader = new FileReader();

        reader.onload = function(e) {
            image.src = e.target.result;
        };

        reader.readAsDataURL(selected);
    });
}


setupImageUpload("imgA", "fileA");
setupImageUpload("imgB", "fileB");
setupImageUpload("imgA2", "fileA2");
setupImageUpload("imgB2", "fileB2");

setupImageUpload("imgMainA", "fileMainA");
setupImageUpload("imgMainB", "fileMainB");


/* =====================================================
   배경 그라데이션
===================================================== */

const template = document.getElementById("template");

const bgType = document.getElementById("bgType");
const bgColor1 = document.getElementById("bgColor1");
const bgColor2 = document.getElementById("bgColor2");


function updateBackground() {

    const type = bgType.value;

    const c1 = bgColor1.value;
    const c2 = bgColor2.value;

    if (type === "solid") {

        template.style.background = c1;

    } else if (type === "linear") {

        template.style.background =
            `linear-gradient(135deg, ${c1}, ${c2})`;

    } else {

        template.style.background =
            `radial-gradient(circle, ${c1}, ${c2})`;

    }
}


bgType.addEventListener("change", updateBackground);
bgColor1.addEventListener("input", updateBackground);
bgColor2.addEventListener("input", updateBackground);


/* =====================================================
   텍스트 선택 시스템
===================================================== */

let selectedText = null;

const fontSize = document.getElementById("fontSize");
const fontSizeValue = document
